.hero nav{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

.hero nav a.pri{background:linear-gradient(135deg,var(--gold),#b8923f);color:#2a2109;
 box-shadow:0 8px 22px rgba(200,164,92,.30)}
.hero nav a.pri:hover{transform:translateY(-2px);text-decoration:none}
.hero nav a.ghost{background:rgba(255,255,255,.07);color:#dfe8f3;

.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;

 overflow:hidden;transition:.24s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
 background:linear-gradient(90deg,var(--navy),var(--navy2) 55%,var(--gold))}
.card::after{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;

.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(11,37,69,.11);
 border-color:#cfd6de;text-decoration:none}
.card:hover::after{opacity:1}
.card h3{margin:0 0 8px;font-size:18px;line-height:1.45;color:var(--navy);letter-spacing:.2px}
.card p{margin:0 0 14px;color:var(--muted);font-size:14px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.tag{display:inline-block;font-size:11.5px;letter-spacing:1.6px;font-weight:700;color:var(--gold);

 padding:2px 11px;white-space:nowrap}
.when{color:var(--muted);font-size:12.5px;white-space:nowrap}

.article{max-width:760px;margin:0 auto;padding:48px 24px 96px}

 border-bottom:1px solid var(--line)}
.article p{margin:0 0 18px;font-size:16.5px;line-height:1.9}
.article h2{font-size:21px;margin:40px 0 14px;color:var(--navy);padding-bottom:8px;
 border-bottom:1px solid var(--line)}
.article h3{font-size:17.5px;margin:32px 0 10px;color:var(--navy)}
.article hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.article blockquote{margin:0 0 18px;padding:2px 18px;border-left:3px solid var(--gold);
 color:var(--muted)}
.article code{background:#f0f2f5;padding:1px 6px;border-radius:4px;font-size:14px;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.article pre{background:#0e1c2e;color:#e6edf5;padding:16px 18px;border-radius:10px;overflow:auto}
.article pre code{background:none;padding:0;color:inherit}
.article ul{padding-left:22px;margin:0 0 18px} .article li{margin:0 0 8px}
.article img{max-width:100%;height:auto;border-radius:10px}

footer.site{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 40px;
 color:var(--muted);font-size:13px}
footer.site p{margin:0 0 6px}

@media(max-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(286px,1fr))}}

</style>
